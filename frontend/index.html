<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeHub - Premium Footwear Collection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #e2e8f0; }
        
        .navbar { 
            background: rgba(15, 23, 42, 0.95) !important; 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid rgba(148, 163, 184, 0.2); 
        }
        
        .navbar-brand { 
            font-size: 1.5rem; 
            font-weight: 700; 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .btn-outline-light { 
            border-color: rgba(226, 232, 240, 0.3); 
            color: #cbd5e1; 
            transition: all 0.3s ease; 
        }
        
        .btn-outline-light:hover { 
            background: rgba(226, 232, 240, 0.1); 
            border-color: rgba(59, 130, 246, 0.6); 
            color: #60a5fa; 
        }
        
        .hero-section { 
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1)); 
            padding: 4rem 2rem; 
            border-radius: 20px; 
            border: 1px solid rgba(148, 163, 184, 0.2); 
            text-align: center; 
            margin-bottom: 3rem; 
            backdrop-filter: blur(10px); 
        }
        
        .hero-section h1 { 
            font-size: 3rem; 
            font-weight: 700; 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 1rem; 
        }
        
        .hero-section p { 
            font-size: 1.1rem; 
            color: #cbd5e1; 
            margin-bottom: 2rem; 
        }
        
        .products-header { 
            text-align: center; 
            margin: 3rem 0 2rem; 
        }
        
        .products-header h2 { 
            font-size: 2.5rem; 
            font-weight: 700; 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .product-card { 
            background: rgba(30, 41, 59, 0.8); 
            border: 1px solid rgba(148, 163, 184, 0.2); 
            border-radius: 15px; 
            overflow: hidden; 
            transition: all 0.3s ease; 
            backdrop-filter: blur(10px); 
            height: 100%; 
        }
        
        .product-card:hover { 
            border-color: rgba(59, 130, 246, 0.5); 
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2); 
            transform: translateY(-5px); 
        }
        
        .product-image { 
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
            background: rgba(15, 23, 42, 0.6); 
        }
        
        .product-body { 
            padding: 1.5rem; 
        }
        
        .product-name { 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: #e2e8f0; 
            margin-bottom: 0.5rem; 
        }
        
        .product-price { 
            font-size: 1.5rem; 
            font-weight: 700; 
            background: linear-gradient(135deg, #10b981, #059669); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 0.75rem; 
        }
        
        .product-desc { 
            color: #cbd5e1; 
            font-size: 0.9rem; 
            margin-bottom: 1rem; 
            line-height: 1.5; 
        }
        
        .product-stock { 
            font-size: 0.85rem; 
            color: #60a5fa; 
            margin-bottom: 1rem; 
        }
        
        .product-stock.low { 
            color: #f59e0b; 
        }
        
        .product-stock.out { 
            color: #ef4444; 
        }
        
        .btn-add-cart { 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); 
            border: none; 
            color: white; 
            font-weight: 700; 
            border-radius: 8px; 
            padding: 0.7rem 1.5rem; 
            transition: all 0.3s ease; 
            width: 100%; 
        }
        
        .btn-add-cart:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); 
        }
        
        .btn-add-cart:disabled { 
            background: rgba(107, 114, 128, 0.5); 
            cursor: not-allowed; 
            transform: none; 
        }
        
        .offcanvas { 
            background: rgba(15, 23, 42, 0.95) !important; 
            backdrop-filter: blur(10px); 
        }
        
        .offcanvas-header { 
            border-bottom: 1px solid rgba(148, 163, 184, 0.2); 
        }
        
        .offcanvas-title { 
            color: #e2e8f0 !important; 
            font-weight: 700; 
        }
        
        .offcanvas-body { 
            color: #cbd5e1; 
        }
        
        .list-group-item { 
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(148, 163, 184, 0.2); 
            color: #cbd5e1; 
        }
        
        .list-group-item:hover { 
            background: rgba(30, 41, 59, 0.8); 
        }
        
        .cart-item-remove { 
            color: #ef4444; 
            cursor: pointer; 
            transition: all 0.3s ease; 
        }
        
        .cart-item-remove:hover { 
            color: #dc2626; 
        }
        
        .form-control { 
            background: rgba(30, 41, 59, 0.8); 
            border: 1px solid rgba(148, 163, 184, 0.3); 
            color: #e2e8f0; 
            transition: all 0.3s ease; 
        }
        
        .form-control:focus { 
            background: rgba(30, 41, 59, 0.95); 
            border-color: rgba(59, 130, 246, 0.6); 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); 
            color: #e2e8f0; 
        }
        
        .form-control::placeholder { 
            color: rgba(203, 213, 225, 0.5); 
        }
        
        .form-label { 
            color: #cbd5e1; 
            font-weight: 600; 
        }
        
        .btn-primary { 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); 
            border: none; 
        }
        
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); 
        }
        
        .empty-cart { 
            text-align: center; 
            padding: 2rem; 
            color: #cbd5e1; 
        }
        
        .empty-cart i { 
            font-size: 3rem; 
            color: #60a5fa; 
            margin-bottom: 1rem; 
        }
        
        @media (max-width: 768px) {
            .hero-section h1 { font-size: 2rem; }
            .products-header h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="fas fa-shoe-prints"></i> ShoeHub</a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="d-flex gap-2 ms-auto">
                    <a class="btn btn-outline-light" href="about.html"><i class="fas fa-info-circle"></i> About</a>
                    <a class="btn btn-outline-light" href="index.html"><i class="fas fa-shopping-bag"></i> Products</a>
                    <a class="btn btn-outline-light" href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
                    <a class="btn btn-outline-light" href="admin-login.html" title="Admin Panel"><i class="fas fa-lock"></i> Admin</a>
                    <button class="btn btn-outline-light position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cart-section">
                        <i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">0</span>)
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <!-- Hero Section -->
        <div class="hero-section">
            <h1><i class="fas fa-shoe-prints"></i> Premium Footwear Collection</h1>
            <p>Discover our exclusive selection of premium shoes designed for comfort, style, and performance.</p>
        </div>

        <!-- Products Header -->
        <div class="products-header">
            <h2>Shop Our Latest Shoes</h2>
        </div>

        <!-- Product List -->
        <div id="product-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- Products will be injected here by script.js -->
        </div>
    </main>

    <!-- Cart Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="cart-section" aria-labelledby="cart-section-label">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="cart-section-label">
                <i class="fas fa-shopping-cart"></i> Shopping Cart (<span id="cart-total-items">0</span>)
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <!-- Cart Items List -->
            <ul id="cart-list" class="list-group list-group-flush flex-grow-1">
                <!-- Cart items will be injected here by script.js -->
            </ul>

            <!-- Empty Cart Message -->
            <div id="empty-cart-message" class="empty-cart">
                <i class="fas fa-inbox"></i>
                <p>Your cart is empty</p>
            </div>

            <!-- Total and Checkout Section -->
            <div class="mt-4 pt-3 border-top" id="checkout-container" style="display: none;">
                <div id="total-container" class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Total:</h5>
                    <h4 class="mb-0 fw-bold text-success"><span id="total">₱0.00</span></h4>
                </div>

                <h6>Checkout Details</h6>
                
                <!-- Checkout Form -->
                <form id="checkout-form">
                    <div class="mb-3">
                        <label for="customer-name" class="form-label visually-hidden">Name</label>
                        <input type="text" class="form-control" id="customer-name" placeholder="Full Name" required>
                    </div>
                    <div class="mb-3">
                        <label for="customer-email" class="form-label visually-hidden">Email</label>
                        <input type="email" class="form-control" id="customer-email" placeholder="Email address" required>
                    </div>
                    <div class="mb-3">
                        <label for="customer-address" class="form-label visually-hidden">Address</label>
                        <textarea class="form-control" id="customer-address" rows="2" placeholder="Shipping address" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3" id="confirm-checkout">Place Order</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <!-- Your Custom JS -->
    <script src="script.js"></script>

</body>
</html>
